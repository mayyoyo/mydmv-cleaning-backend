<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | My DMV Cleaning Services</title>

<link rel="stylesheet" href="../css/admin-login.css">

</head>


<body>


<div class="login-wrapper">


<div class="login-box">


<h2>
🧼 Admin Login
</h2>



<input 
id="username" 
placeholder="Username"
autocomplete="username">



<input 
id="password" 
type="password" 
placeholder="Password"
autocomplete="current-password">



<button onclick="login()">
Login
</button>



<p id="msg"></p>



</div>


</div>






<script>


// ================= API =================

const API = "http://localhost:5000";




// ================= LOGIN =================

async function login(){



const username =
document
.getElementById("username")
.value
.trim();



const password =
document
.getElementById("password")
.value
.trim();



const msg =
document.getElementById("msg");




if(!username || !password){


msg.innerText =
"Please enter username and password";


return;


}



msg.innerText =
"Logging in...";





try{



const res =
await fetch(

API + "/api/admin/login",

{


method:"POST",


headers:{


"Content-Type":
"application/json"


},


body:JSON.stringify({

username:username,

password:password

})


}

);





const data =
await res.json();




console.log(
"Login response:",
data
);





if(data.success && data.token){



localStorage.setItem(

"adminToken",

data.token

);





msg.innerText =
"Login successful ✅";





setTimeout(()=>{


window.location.href =
"/admin/dashboard.html";


},800);




}

else{



msg.innerText =
data.error || "Invalid login ❌";


}



}

catch(error){



console.error(
"Login error:",
error
);



msg.innerText =
"Server connection error ❌";


}



}






// ================= ENTER KEY =================


document.addEventListener(
"keydown",
(e)=>{


if(e.key==="Enter"){


login();


}


});



</script>



</body>

</html>
