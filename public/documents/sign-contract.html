<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Contract | My DMV Cleaning Services LLC</title>

<link rel="stylesheet" href="../css/legal.css">

</head>


<body>


<header class="legal-nav">

<div class="logo">
🧼 My DMV Cleaning Services
</div>


<nav>

<a href="../index.html">🏠 Home</a>

<a href="../booking.html">📅 Booking</a>

<a href="../documents.html">📄 Documents</a>

</nav>

</header>




<div class="container">


<h1 class="fade">
📝 Sign Your Contract
</h1>


<p class="effective fade">
Please complete the information below to sign your service agreement.
</p>




<div class="sign-box">


<label>Full Name *</label>

<input 
class="input"
id="name"
placeholder="Enter your full name">



<label>Email *</label>

<input 
class="input"
id="email"
type="email"
placeholder="Enter your email">



<label>Phone Number</label>

<input 
class="input"
id="phone"
placeholder="Enter your phone number">



<label>Contract Type</label>

<select class="input" id="contractType">

<option value="Service Agreement">
Service Agreement
</option>

<option value="Client Contract">
Client Contract
</option>

<option value="Contractor Agreement">
Contractor Agreement
</option>

</select>




<label>Typed Signature *</label>

<input 
class="input"
id="typedName"
placeholder="Type your name as signature">



<h3>
✍️ Draw Signature
</h3>


<canvas 
id="canvas"
width="400"
height="150">
</canvas>



<div class="buttons">

<button 
type="button"
class="legal-btn clear"
onclick="clearCanvas()">

🧹 Clear

</button>



<button 
type="button"
class="legal-btn"
onclick="submitContract()">

✅ Sign & Submit

</button>


</div>



<div id="msg"></div>


</div>

</div>





<footer class="legal-footer">

<a href="../legal/privacy.html">
🔒 Privacy
</a>

<a href="../legal/terms.html">
📜 Terms
</a>

<a href="../legal/refund.html">
💰 Refund
</a>

<a href="client-contract.html">
📄 Client Contract
</a>

<a href="contractor-agreement.html">
👷 Contractor Agreement
</a>

<a href="../documents.html">
📄 Documents
</a>


</footer>





<script>


// ================= BACKEND API =================


const API =

window.location.hostname === "localhost"

?

"http://localhost:5000"

:

"https://dmv-cleaning-backend.onrender.com";




// ================= CANVAS SIGNATURE =================


const canvas =
document.getElementById("canvas");


const ctx =
canvas.getContext("2d");


let drawing=false;


ctx.lineWidth = 2;

ctx.lineCap = "round";



function getPosition(e){

const rect =
canvas.getBoundingClientRect();


if(e.touches){

return {

x:e.touches[0].clientX - rect.left,

y:e.touches[0].clientY - rect.top

};

}


return {

x:e.clientX - rect.left,

y:e.clientY - rect.top

};

}



function startDrawing(e){

drawing=true;

const pos=getPosition(e);

ctx.beginPath();

ctx.moveTo(
pos.x,
pos.y
);

}



function draw(e){

if(!drawing)
return;


e.preventDefault();


const pos=getPosition(e);


ctx.lineTo(
pos.x,
pos.y
);


ctx.stroke();

}



function stopDrawing(){

drawing=false;

ctx.beginPath();

}



canvas.addEventListener(
"mousedown",
startDrawing
);


canvas.addEventListener(
"mousemove",
draw
);


canvas.addEventListener(
"mouseup",
stopDrawing
);


canvas.addEventListener(
"mouseleave",
stopDrawing
);



canvas.addEventListener(
"touchstart",
startDrawing
);


canvas.addEventListener(
"touchmove",
draw
);


canvas.addEventListener(
"touchend",
stopDrawing
);





function clearCanvas(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

}





// ================= SUBMIT CONTRACT =================


async function submitContract(){



const type =
new URLSearchParams(
window.location.search
)
.get("type");



const data = {


name:

document
.getElementById("name")
.value
.trim(),



email:

document
.getElementById("email")
.value
.trim(),



phone:

document
.getElementById("phone")
.value
.trim(),



typedName:

document
.getElementById("typedName")
.value
.trim(),



contractType:

type ||

document
.getElementById("contractType")
.value,



signature:

canvas.toDataURL("image/png")


};





if(
!data.name ||
!data.email ||
!data.typedName
){

document.getElementById("msg").innerHTML =

`
<p style="color:red">
❌ Please complete required fields.
</p>
`;

return;

}





try{


document.getElementById("msg").innerHTML =

`
<p>
⏳ Creating contract PDF...
</p>
`;




const res = await fetch(

`${API}/api/sign-contract`,

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify(data)

}

);





const text =
await res.text();



console.log(
"SERVER RESPONSE:",
text
);



let result;


try{

result =
JSON.parse(text);

}

catch{

throw new Error(
"Server returned invalid response"
);

}





if(
result.success &&
result.pdf
){



let pdfURL =
result.pdf;



if(
!pdfURL.startsWith("http")
){

pdfURL =
API + pdfURL;

}




document.getElementById("msg").innerHTML =


`

<div style="margin-top:25px">


<h3 style="color:green">

✅ Contract signed successfully!

</h3>



<a href="${pdfURL}"

target="_blank"

style="
display:inline-block;
margin-top:15px;
padding:12px 20px;
background:#007bff;
color:white;
border-radius:8px;
text-decoration:none;
font-size:18px;
">

📄 Open Signed Contract PDF

</a>


</div>

`;



}

else{


throw new Error(
result.error || "Contract failed"
);


}




}

catch(error){


console.error(
"CONTRACT ERROR:",
error
);



document.getElementById("msg").innerHTML =

`

<p style="color:red">

❌ ${error.message}

</p>

`;



}



}



</script>


</body>

</html>
