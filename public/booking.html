<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Cleaning Service</title>

<link rel="stylesheet" href="./css/booking.css">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

</head>


<body>


<header class="navbar">

<div class="logo">
🧼 My DMV Cleaning Services
</div>


<div class="hamburger" onclick="toggleMenu()">
☰
</div>


<nav class="nav-links" id="navLinks">

<a href="index.html">
🏠 Home
</a>


<a href="booking.html">
📅 Booking
</a>

</nav>

</header>





<main class="booking-page">

<section class="booking-card">


<h2>
📅 Book Cleaning Service
</h2>


<div id="calendar"></div>


<p id="selectedDate">
No date selected
</p>



<select id="service" class="input">

<option value="">
Select Service
</option>

<option value="120">
House Cleaning - $120
</option>

<option value="180">
Office Cleaning - $180
</option>

<option value="200">
Deep Cleaning - $200
</option>

<option value="250">
Move In/Out Cleaning - $250
</option>

</select>



<select id="timeSlot" class="input">

<option value="">
Select Time
</option>

<option value="08:00-10:00">
08:00-10:00
</option>

<option value="10:00-12:00">
10:00-12:00
</option>

<option value="12:00-14:00">
12:00-14:00
</option>

<option value="14:00-16:00">
14:00-16:00
</option>

<option value="16:00-18:00">
16:00-18:00
</option>

</select>




<input id="name" class="input" placeholder="Full Name">

<input id="phone" class="input" placeholder="Phone">

<input id="email" class="input" placeholder="Email">

<input id="address" class="input" placeholder="Address">



<div class="btn-group">


<button onclick="payNow()" class="btn pay">

💳 Pay Now (25% Deposit)

</button>



<button onclick="payLater()" class="btn later">

📌 Pay Later

</button>



</div>


</section>

</main>







<script>

// ✅ FIXED API URL (Render backend)
const API = "https://dmv-cleaning-backend.onrender.com";

let selectedDate = null;

function toggleMenu(){
  document
    .getElementById("navLinks")
    .classList.toggle("active");
}

// ================= CALENDAR =================

document.addEventListener(
"DOMContentLoaded",
async()=>{

  const calendar =
  new FullCalendar.Calendar(
    document.getElementById("calendar"),
    {
      initialView:"dayGridMonth",

      dateClick: async function(info){

        selectedDate = info.dateStr;

        document.getElementById("selectedDate")
        .innerText = "Selected: " + selectedDate;

        await loadBookedSlots(selectedDate);
      }
    }
  );

  calendar.render();
});

// ================= LOAD BOOKED SLOTS =================

async function loadBookedSlots(date){
  try{

    const res =
    await fetch(`${API}/api/bookings-by-date/${date}`);

    const booked = await res.json();

    const select = document.getElementById("timeSlot");

    Array.from(select.options).forEach(opt=>{
      if(opt.value==="") return;
      opt.disabled=false;
      opt.textContent=opt.value;
    });

    booked.forEach(slot=>{
      const option =
      Array.from(select.options)
      .find(o=>o.value===slot);

      if(option){
        option.disabled=true;
        option.textContent = slot + " (Booked)";
      }
    });

  } catch(err){
    console.error("Slot error:", err);
  }
}
</script>

</body>

</html>
