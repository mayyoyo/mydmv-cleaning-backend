<!DOCTYPE html>
<html>
<head>

<title>Documents Admin</title>

<link rel="stylesheet" href="../css/dashboard.css">

<style>

.main{
  padding:20px;
}

.card{
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

button{
  margin-top:10px;
  margin-right:10px;
  padding:8px 12px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

.view{
  background:#3498db;
  color:white;
}

.approve{
  background:#2ecc71;
  color:white;
}

</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>📄 Documents</h2>

  <a href="/public/admin/login.html">Dashboard</a>
  <a href="/public/admin/documents.html">Documents</a>
  <a href="/public/index.html">Home</a>
</div>


<!-- MAIN CONTENT -->
<div class="main">

  <h2>📄 Signed Contracts</h2>

  <div id="contracts"></div>

</div>



<script>

// ================= LOAD CONTRACTS =================

async function loadContracts(){

  const res = await fetch("/api/admin/contracts");
  const contracts = await res.json();

  const container = document.getElementById("contracts");
  container.innerHTML = "";

  if(contracts.length === 0){
    container.innerHTML = "<p>No contracts yet</p>";
    return;
  }

  contracts.forEach(c => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <h3>${c.name}</h3>

      <p><b>Email:</b> ${c.email}</p>
      <p><b>Booking ID:</b> ${c.bookingId}</p>
      <p><b>Type:</b> ${c.contractType}</p>

      <button class="view" onclick="viewSignature('${c.signature}')">
        View Signature
      </button>

      <button class="approve" onclick="approveContract(${c.id})">
        Approve
      </button>
    `;

    container.appendChild(div);

  });

}



// ================= VIEW SIGNATURE =================

function viewSignature(sig){
  const win = window.open();
  win.document.write(`<img src="${sig}" style="width:100%">`);
}



// ================= APPROVE CONTRACT =================

async function approveContract(id){

  await fetch(`/api/admin/contracts/approve/${id}`,{
    method:"POST"
  });

  alert("✅ Contract Approved");

  loadContracts();

}



// ================= AUTO LOAD =================

loadContracts();

</script>

</body>
</html>
