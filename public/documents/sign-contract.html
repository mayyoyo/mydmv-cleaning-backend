<!-- ================= SIGN PAGE ================= -->

<div class="container">

<h1 class="fade">
📝 Sign Your Contract
</h1>

<p class="effective fade">
Please complete the information below to sign your service agreement.
</p>


<div class="sign-box">

<label>Full Name</label>
<input class="input" id="name" placeholder="Enter your full name">


<label>Email</label>
<input class="input" id="email" type="email" placeholder="Enter your email">


<label>Phone Number</label>
<input class="input" id="phone" placeholder="Enter your phone number">


<label>Typed Signature</label>
<input class="input" id="typedName" placeholder="Type Your Name as Signature">


<h3>✍️ Draw Signature</h3>

<canvas id="canvas" width="400" height="150"></canvas>


<div class="buttons">

<button class="legal-btn clear" onclick="clearCanvas()">
🧹 Clear
</button>

<button class="legal-btn" onclick="submitContract()">
✅ Sign & Submit
</button>

</div>

<p id="msg"></p>

</div>

</div>
