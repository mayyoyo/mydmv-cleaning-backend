<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link rel="stylesheet" href="../css/admin-login.css">

 


</head>


<body>


<div class="login-wrapper">


<div class="login-box">


<h2>
🧼 Admin Login
</h2>



<input 
id="username" 
placeholder="Username"
autocomplete="username">



<input 
id="password" 
type="password" 
placeholder="Password"
autocomplete="current-password">



<button onclick="login()">
Login
</button>



<p id="msg"></p>



</div>


</div>







<script>


const API = "http://localhost:3000";





async function login(){


const username =
document.getElementById("username")
.value
.trim();



const password =
document.getElementById("password")
.value
.trim();



const msg =
document.getElementById("msg");




if(!username || !password){

msg.innerText =
"Please enter username and password";

return;

}



msg.innerText =
"Logging in...";





try{


const res =
await fetch(

API + "/admin/login",

{


method:"POST",


headers:{

"Content-Type":
"application/json"

},


body:JSON.stringify({

username,
password

})


}

);






const data =
await res.json();






if(data.success && data.token){



localStorage.setItem(

"adminToken",

data.token

);




msg.innerText =
"Login successful ✅";





setTimeout(()=>{


window.location.href =
"/admin/dashboard.html";


},500);





}

else{


msg.innerText =
data.error || "Invalid login ❌";


}




}

catch(err){


console.error(
"Login error:",
err
);



msg.innerText =
"Server error ❌";


}



}









document.addEventListener(
"keydown",
function(e){


if(e.key==="Enter"){

login();

}


}

);



</script>



</body>

</html>
