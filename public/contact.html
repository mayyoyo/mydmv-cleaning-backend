<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Contact Us | My DMV Cleaning Services LLC
</title>


<link rel="stylesheet" href="./css/style.css">


</head>


<body>


<header class="navbar">


<div class="logo">

🧼 My DMV Cleaning Services LLC

</div>



<div class="hamburger" onclick="toggleMenu()">

☰

</div>




<nav class="nav-links" id="navLinks">


<a href="index.html">
🏠 Home
</a>


<a href="booking.html">
📅 Booking
</a>


<a href="documents.html">
📄 Documents
</a>


<a href="contact.html" class="active">
📞 Contact
</a>



</nav>


</header>





<main class="container">


<h1>
📞 Contact My DMV Cleaning Services LLC
</h1>



<p>
Have questions? Send us a message and we will get back to you.
</p>




<form id="contactForm">



<label>
Name *
</label>


<input
type="text"
id="name"
placeholder="Your full name"
required
>




<label>
Email *
</label>


<input
type="email"
id="email"
placeholder="Your email"
required
>




<label>
Phone
</label>


<input
type="text"
id="phone"
placeholder="Your phone number"
>




<label>
Message *
</label>


<textarea
id="message"
rows="6"
placeholder="Write your message"
required>
</textarea>





<button type="submit" class="btn">

📩 Send Message

</button>




<p id="result"></p>




</form>


</main>







<footer class="footer">


<p>

© 2026 My DMV Cleaning Services LLC

</p>


</footer>







<script>


// ================= API =================

const API =

window.location.hostname === "localhost"

?

"http://localhost:5000"

:

"https://dmv-cleaning-backend.onrender.com";




// ================= MOBILE MENU =================


function toggleMenu(){

document
.getElementById("navLinks")
.classList
.toggle("active");

}




// ================= CONTACT FORM =================


document
.getElementById("contactForm")
.addEventListener(
"submit",
async function(e){


e.preventDefault();



const result =
document.getElementById("result");



const data = {


name:
document.getElementById("name")
.value
.trim(),


email:
document.getElementById("email")
.value
.trim(),


phone:
document.getElementById("phone")
.value
.trim(),


message:
document.getElementById("message")
.value
.trim()


};




if(
!data.name ||
!data.email ||
!data.message
){

result.innerHTML =
"❌ Please complete required fields.";

return;

}




result.innerHTML =
"⏳ Sending message...";




try{


const res =
await fetch(

`${API}/api/contact`,

{


method:"POST",


headers:{

"Content-Type":"application/json"

},


body:

JSON.stringify(data)


}

);




const response =
await res.json();





if(response.success){


result.innerHTML =
"✅ Message sent successfully! We will contact you soon.";



document
.getElementById("contactForm")
.reset();


}

else{


result.innerHTML =
"❌ " + (response.error || "Message failed");


}



}

catch(error){


console.error(
"CONTACT ERROR:",
error
);



result.innerHTML =
"❌ Server connection failed.";


}



});



</script>



</body>

</html>
