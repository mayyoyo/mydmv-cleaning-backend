<!DOCTYPE html>
<html>
<head>
  <title>Admin Contracts</title>
  <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

<div class="container">
  <h1>Signed Contracts</h1>

  <div id="list"></div>
</div>

<script>
async function loadContracts() {
  try {
    const res = await fetch("/api/admin/contracts");

    if (!res.ok) {
      throw new Error("Failed to load contracts");
    }

    const data = await res.json();

    const list = document.getElementById("list");
    list.innerHTML = ""; // clear first

    if (data.length === 0) {
      list.innerHTML = "<p>No contracts found.</p>";
      return;
    }

    data.forEach(c => {
      const div = document.createElement("div");

      div.innerHTML = `
        <h3>${c.name || "No Name"}</h3>
        <p><strong>Email:</strong> ${c.email || ""}</p>
        <p><strong>Phone:</strong> ${c.phone || ""}</p>
        <p><strong>Contract Type:</strong> ${c.contractType || ""}</p>
        <a href="${c.pdfUrl}" target="_blank">📄 Download PDF</a>
        <hr>
      `;

      list.appendChild(div);
    });

  } catch (err) {
    console.error(err);
    document.getElementById("list").innerHTML =
      "<p style='color:red;'>Error loading contracts</p>";
  }
}

loadContracts();
</script>

</body>
</html>
